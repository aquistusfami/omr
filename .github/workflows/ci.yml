name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cài dependency
        run: npm ci
        working-directory: web

      - name: Type check
        run: npx tsc --noEmit
        working-directory: web

      # 3 phiếu giả lập + máy trạng thái quét + file .xlsx
      - name: Test
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependency python
        run: pip install numpy scipy pillow openpyxl

      # template.json phải khớp fixtures/blank-form.png
      - name: Template khớp phiếu mẫu
        run: python3 tools/build_template.py --check

      # kiểm tra độc lập: bước Test ở trên đã sinh ra file trong thư mục tmp
      - name: File .xlsx mở được, giữ số 0 đầu
        run: |
          python3 - <<'PY'
          import os, tempfile, openpyxl
          path = os.path.join(tempfile.gettempdir(), "omr-test.xlsx")
          sheet = openpyxl.load_workbook(path).active
          assert sheet.title == "Ket qua"
          assert sheet["B2"].value == "045123678", sheet["B2"].value
          print("xlsx ok:", sheet.dimensions)
          PY

      # report.py tính điểm theo key.json và xuất 4 sheet
      - name: Báo cáo Excel từ dữ liệu mẫu
        run: |
          python3 tools/report.py --dir fixtures/sample-run -o "$RUNNER_TEMP/bao-cao.xlsx"
          python3 - <<'PY'
          import os, openpyxl
          wb = openpyxl.load_workbook(os.path.join(os.environ["RUNNER_TEMP"], "bao-cao.xlsx"))
          assert wb.sheetnames == ["Danh sach", "Phong diem", "Theo ma de", "Nghi van"], wb.sheetnames
          ws = wb["Danh sach"]
          assert (ws.max_row, ws.max_column) == (4, 49), ws.dimensions
          assert ws["AS2"].value == 30, ws["AS2"].value  # cột điểm: phiếu đúng hết = 30
          print("report ok:", ws.dimensions)
          PY

  # https miễn phí, cần cho camera trên điện thoại
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deploy
        uses: actions/deploy-pages@v4
