<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chấm phiếu trắc nghiệm</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Chấm phiếu trắc nghiệm</h1>
      <p id="template-name" class="muted"></p>
    </header>

    <main>
      <section class="modes">
        <button id="auto" type="button" class="primary">Quét tự động</button>
        <button id="manual" type="button">Chụp thủ công</button>
      </section>

      <section id="stage" class="stage" hidden>
        <video id="video" playsinline muted></video>
        <div class="guide"></div>
      </section>

      <div id="banner" class="banner wait">Sẵn sàng</div>

      <section class="actions">
        <label id="file-label" class="primary" hidden>
          Chụp phiếu
          <input id="file" type="file" accept="image/*" capture="environment" hidden />
        </label>
        <button id="csv" type="button">CSV</button>
        <button id="xlsx" type="button">Excel</button>
        <button id="json" type="button">JSON</button>
        <button id="clear" type="button" class="ghost">Xoá hết</button>
      </section>

      <p id="status" class="status" role="status"></p>

      <section id="list" class="list"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
